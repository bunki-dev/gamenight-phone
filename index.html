<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06071a">
<title>Game Night Controller</title>
<style>
  :root { --bg:#06071a; --panel:#11143a; --text:#eef3ff; --muted:#9aa6d6; --cyan:#2ef2ff; --pink:#ff3ec9; --lime:#7bff4a; --red:#ff4f4f; --yellow:#ffe23e; --me:#2ef2ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: none; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }
  .screen.on { display: flex; }
  h1 { margin: 6px 0 4px; font-size: 30px; letter-spacing: 2px; }
  h1 span { color: var(--pink); }
  p { margin: 6px 0; color: var(--muted); }
  .center { margin: auto 0; text-align: center; }
  input.code, input.name { width: 100%; max-width: 340px; padding: 12px; margin: 10px auto 6px; display: block; text-align: center; color: var(--text);
    background: var(--panel); border: 3px solid #2a2f6e; border-radius: 16px; outline: none; -webkit-user-select: text; user-select: text; }
  input.code { font: 800 36px/1 system-ui, sans-serif; letter-spacing: 12px; text-transform: uppercase; }
  input.name { font: 700 22px/1 system-ui, sans-serif; }
  input:focus { border-color: var(--cyan); }
  label.small { display: block; font-size: 13px; color: var(--muted); margin-top: 12px; }
  button { font: 800 18px system-ui, sans-serif; color: #06071a; background: var(--cyan); border: 0; border-radius: 999px; padding: 14px 26px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 2px solid #3a4180; }
  button.pink { background: var(--pink); }
  .msg { min-height: 24px; margin-top: 10px; }
  .msg.err { color: var(--red); }
  .bar { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .bar .sp { flex: 1; }
  .pill { padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.08); white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--red); }
  .dot.on { background: var(--lime); } .dot.mid { background: var(--yellow); }
  .you { padding: 5px 12px; border-radius: 999px; color: #06071a; background: var(--me); }

  /* lobby */
  #s-lobby .big { margin: auto; width: min(80vw, 340px); aspect-ratio: 1; border-radius: 50%; font-size: 30px; background: radial-gradient(circle at 40% 35%, #ff7ad9, var(--pink)); box-shadow: 0 0 60px rgba(255,62,201,.5); }
  #s-lobby .big:active { transform: scale(.96); }

  /* camera */
  #stage { position: relative; flex: 1; margin: 10px 0; border-radius: 18px; overflow: hidden; background: #000; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { display: none; }
  #big { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; background: rgba(6,7,26,.5); padding: 20px; pointer-events: none; }
  #big.on { display: flex; }
  #big b { font-size: 30px; line-height: 1.2; text-shadow: 0 2px 10px #000; }
  #big i { font-style: normal; font-size: 90px; font-weight: 900; color: var(--cyan); }
  #big p { color: #dfe6ff; text-shadow: 0 2px 8px #000; }
  #tip { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 10px 14px; border-radius: 14px; background: rgba(6,7,26,.8); font-weight: 800; text-align: center; display: none; }
  #tip.on { display: block; }
  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip { padding: 7px 12px; border-radius: 12px; background: var(--panel); font-weight: 800; font-size: 15px; min-width: 58px; text-align: center; }
  .chip.on { background: var(--cyan); color: #06071a; }
  .chip.jump.on { background: var(--lime); } .chip.duck.on { background: var(--pink); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row button { flex: 1; padding: 12px 6px; font-size: 16px; }

  /* touch pad */
  #pad { position: relative; flex: 1; margin-top: 10px; border-radius: 22px; overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #1a1f55, #0a0c26); border: 3px solid var(--me); box-shadow: inset 0 0 60px rgba(46,242,255,.15); }
  #pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #padHint { position: absolute; left: 0; right: 0; top: 40%; text-align: center; color: var(--muted); font-weight: 800; pointer-events: none; }

  /* quiz */
  #q-text { font-size: 18px; font-weight: 700; min-height: 54px; margin: 8px 2px; }
  .answers { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ans { border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px;
    font: 800 17px/1.25 system-ui, sans-serif; color: #fff; border: 4px solid transparent; position: relative; }
  .ans b { font-size: 34px; line-height: 1; margin-bottom: 6px; }
  .ans.a0 { background: #e0303f; } .ans.a1 { background: #2a6cf0; } .ans.a2 { background: #d9a400; } .ans.a3 { background: #23a845; }
  .ans.dim { opacity: .3; } .ans.pick { border-color: #fff; transform: scale(1.03); }
  .ans.right { box-shadow: 0 0 0 6px var(--lime), 0 0 30px var(--lime); opacity: 1; transform: scale(1.04); } .ans.wrong { opacity: .25; }
  #q-res { min-height: 30px; text-align: center; font-weight: 900; font-size: 22px; margin-top: 8px; }
</style>
</head>
<body>

<!-- 1. Join -->
<section id="s-join" class="screen on">
  <div class="center">
    <h1>GAME <span>NIGHT</span></h1>
    <p>Enter the room code shown on the TV</p>
    <input id="code" class="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE">
    <label class="small" for="name">Your name</label>
    <input id="name" class="name" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Player">
    <button id="go" style="margin-top:12px">Connect</button>
    <div id="joinMsg" class="msg"></div>
  </div>
  <p class="small" style="text-align:center">Your camera video never leaves this phone. Only moves like "left" or "jump" are sent to the TV.</p>
</section>

<!-- top bar shared by the in-game screens -->
<template id="tpl-bar">
  <div class="bar"><span class="pill"><span class="dot linkDot"></span><span class="linkTxt">Connecting…</span></span><span class="sp"></span><span class="you youTag" style="display:none"></span></div>
</template>

<!-- 2. Lobby / buttons -->
<section id="s-lobby" class="screen">
  <div class="barSlot"></div>
  <p id="lobbyTxt" style="text-align:center;margin-top:18px">Connected! Press JOIN to play.</p>
  <button class="big" id="b-bigjoin">JOIN</button>
  <p style="text-align:center">Press again to start the game</p>
</section>

<!-- 3. Camera -->
<section id="s-cam" class="screen">
  <div class="barSlot"></div>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="view"></canvas>
    <div id="big"></div>
    <div id="tip"></div>
  </div>
  <div class="chips">
    <div class="chip" id="c-left">◀ LEFT</div><div class="chip" id="c-mid">MID</div><div class="chip" id="c-right">RIGHT ▶</div>
    <div class="chip jump" id="c-jump">JUMP</div><div class="chip duck" id="c-duck">DUCK</div>
  </div>
  <div class="row">
    <button id="b-join" class="pink">Join / Start</button>
    <button id="b-cal" class="ghost">Calibrate</button>
    <button id="b-more" class="ghost">⋯</button>
  </div>
  <div class="row" id="more" style="display:none">
    <button id="b-quick" class="ghost">Re-centre me</button>
    <button id="b-swap" class="ghost">Swap L/R</button>
    <button id="b-sens" class="ghost">Sens: normal</button>
  </div>
</section>

<!-- 4. Touch pad (Air Hockey) -->
<section id="s-pad" class="screen">
  <div class="barSlot"></div>
  <div id="pad"><canvas id="padCanvas"></canvas><div id="padHint">Drag your finger to move your mallet</div></div>
  <div class="row"><button id="b-padgo" class="pink">✕ Start / Play again</button></div>
</section>

<!-- 5. Quiz buttons -->
<section id="s-quiz" class="screen">
  <div class="barSlot"></div>
  <div id="q-text">Get ready…</div>
  <div class="answers">
    <div class="ans a0" data-i="0"><b>▲</b><span>A</span></div>
    <div class="ans a1" data-i="1"><b>◆</b><span>B</span></div>
    <div class="ans a2" data-i="2"><b>●</b><span>C</span></div>
    <div class="ans a3" data-i="3"><b>■</b><span>D</span></div>
  </div>
  <div id="q-res"></div>
</section>

<script>
/* ---------- tiny MQTT client (same as the TV's) ---------- */
/* A tiny MQTT 3.1.1 client over WebSocket (QoS 0 only) - just enough to pass small
   messages between phones and the TV through a free public broker. Plain ES5. */
var MqttLite = (function () {
  'use strict';

  var BROKERS = [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://test.mosquitto.org:8081/mqtt'
  ];

  function utf8(str) {
    var out = [], i, c;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) { c = 0x10000 + ((c - 0xd800) << 10) + (str.charCodeAt(++i) - 0xdc00); }
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | c >> 6, 0x80 | c & 63);
      else if (c < 0x10000) out.push(0xe0 | c >> 12, 0x80 | c >> 6 & 63, 0x80 | c & 63);
      else out.push(0xf0 | c >> 18, 0x80 | c >> 12 & 63, 0x80 | c >> 6 & 63, 0x80 | c & 63);
    }
    return out;
  }
  function fromUtf8(bytes) {
    var s = '', i = 0, c;
    while (i < bytes.length) {
      c = bytes[i++];
      if (c >= 0xf0) c = ((c & 7) << 18) | ((bytes[i++] & 63) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
      else if (c >= 0xe0) c = ((c & 15) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
      else if (c >= 0xc0) c = ((c & 31) << 6) | (bytes[i++] & 63);
      if (c > 0xffff) { c -= 0x10000; s += String.fromCharCode(0xd800 + (c >> 10), 0xdc00 + (c & 1023)); }
      else s += String.fromCharCode(c);
    }
    return s;
  }
  function str(s) { var b = utf8(s); return [b.length >> 8, b.length & 255].concat(b); }
  function packet(type, body) {
    var len = body.length, head = [type], d;
    do { d = len % 128; len = Math.floor(len / 128); head.push(len > 0 ? d | 128 : d); } while (len > 0);
    return new Uint8Array(head.concat(body));
  }

  function Client(opts) {
    this.opts = opts || {};
    this.brokers = this.opts.brokers || BROKERS;
    this.brokerIdx = 0;
    this.subs = [];
    this.handlers = [];
    this.connected = false;
    this.buf = [];
    this.pid = 1;
    this.id = this.opts.clientId || ('gn' + Math.random().toString(36).slice(2, 12));
    this.onStatus = this.opts.onStatus || function () {};
    this._connect();
  }

  Client.prototype._connect = function () {
    var self = this, url = this.brokers[this.brokerIdx % this.brokers.length];
    var ws;
    try { ws = new WebSocket(url, 'mqtt'); } catch (e) { return this._retry(); }
    this.ws = ws;
    ws.binaryType = 'arraybuffer';
    var opened = false;
    var giveUp = setTimeout(function () { if (!self.connected) { try { ws.close(); } catch (e) {} } }, 7000);
    ws.onopen = function () {
      opened = true;
      var body = str('MQTT').concat([4, 0x02, 0, 30]).concat(str(self.id)); // v3.1.1, clean session, keepalive 30s
      ws.send(packet(0x10, body));
    };
    ws.onmessage = function (ev) {
      var bytes = new Uint8Array(ev.data);
      for (var i = 0; i < bytes.length; i++) self.buf.push(bytes[i]);
      self._drain();
    };
    ws.onclose = function () {
      clearTimeout(giveUp);
      clearInterval(self.ping);
      var was = self.connected;
      self.connected = false;
      self.buf = [];
      self.onStatus('offline');
      if (!was || !opened) self.brokerIdx++;   // couldn't use this broker: try the next one
      self._retry();
    };
    ws.onerror = function () {};
    this.onStatus('connecting');
  };

  Client.prototype._retry = function () {
    var self = this;
    if (this.closed) return;
    setTimeout(function () { self._connect(); }, 1500);
  };

  Client.prototype._drain = function () {
    while (this.buf.length >= 2) {
      var mult = 1, len = 0, i = 1, d;
      do {
        if (i >= this.buf.length) return;
        d = this.buf[i++];
        len += (d & 127) * mult;
        mult *= 128;
      } while (d & 128);
      if (this.buf.length < i + len) return;
      var type = this.buf[0] >> 4, body = this.buf.slice(i, i + len);
      this.buf = this.buf.slice(i + len);
      this._handle(type, body);
    }
  };

  Client.prototype._handle = function (type, body) {
    var self = this;
    if (type === 2) {                       // CONNACK
      if (body[1] !== 0) { try { this.ws.close(); } catch (e) {} return; }
      this.connected = true;
      this.onStatus('online');
      this.ping = setInterval(function () { self._send(packet(0xc0, [])); }, 20000);
      for (var s = 0; s < this.subs.length; s++) this._subscribe(this.subs[s]);
    } else if (type === 3) {                // PUBLISH (QoS 0)
      var tl = (body[0] << 8) | body[1];
      var topic = fromUtf8(body.slice(2, 2 + tl));
      var msg = fromUtf8(body.slice(2 + tl));
      for (var h = 0; h < this.handlers.length; h++) {
        try { this.handlers[h](topic, msg); } catch (e) {}
      }
    }
  };

  Client.prototype._send = function (p) {
    if (this.ws && this.ws.readyState === 1) { try { this.ws.send(p); } catch (e) {} }
  };

  Client.prototype._subscribe = function (topic) {
    var id = this.pid++ & 0xffff || 1;
    this._send(packet(0x82, [id >> 8, id & 255].concat(str(topic)).concat([0])));
  };

  Client.prototype.subscribe = function (topic) {
    this.subs.push(topic);
    if (this.connected) this._subscribe(topic);
  };

  Client.prototype.onMessage = function (fn) { this.handlers.push(fn); };

  Client.prototype.publish = function (topic, message) {
    if (!this.connected) return false;
    this._send(packet(0x30, str(topic).concat(utf8(message))));
    return true;
  };

  Client.prototype.close = function () {
    this.closed = true;
    clearInterval(this.ping);
    if (this.ws) { this._send(packet(0xe0, [])); try { this.ws.close(); } catch (e) {} }
  };

  return { Client: Client, BROKERS: BROKERS };
})();


</script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('gnp.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('gnp.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const phoneId = store.get('id', null) || ('p' + Math.random().toString(36).slice(2, 10));
  store.set('id', phoneId);
  const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // shared top bar in every screen
  document.querySelectorAll('.barSlot').forEach(s => s.appendChild($('tpl-bar').content.cloneNode(true)));

  // =====================================================================
  // Link to the TV: MQTT relay + direct WebRTC data channel when possible
  // =====================================================================
  let mq = null, room = null, tvSeen = false, pc = null, dc = null, direct = false, rtt = null, rtcTries = 0;
  const handlers = [];
  function connect(code) {
    room = code;
    const opts = { onStatus: () => updateLink() };
    const q = new URLSearchParams(location.search);
    if (q.get('broker')) opts.brokers = [q.get('broker')];
    mq = new MqttLite.Client(opts);
    mq.subscribe('gamenight/v1/' + room + '/down/' + phoneId);
    mq.onMessage((t, raw) => { let m; try { m = JSON.parse(raw); } catch (e) { return; } onTv(m); });
    setInterval(() => send({ t: 'ping', ts: Date.now() }), 2000);
    setTimeout(hello, 500);
  }
  function hello() { sendRelay({ t: 'hello', name: myName(), v: 3, rtc: !!window.RTCPeerConnection }); }
  function myName() { return (store.get('name', '') || '').slice(0, 12); }
  function sendRelay(m) { if (mq) mq.publish('gamenight/v1/' + room + '/up/' + phoneId, JSON.stringify(m)); }
  function send(m) {
    if (direct && dc && dc.readyState === 'open') { try { dc.send(JSON.stringify(m)); return; } catch (e) {} }
    sendRelay(m);
  }

  function startRtc() {
    if (!window.RTCPeerConnection || rtcTries > 3) return;
    rtcTries++;
    try { if (pc) pc.close(); } catch (e) {}
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    dc = pc.createDataChannel('gn', { ordered: true });
    dc.onopen = () => { direct = true; updateLink(); };
    dc.onclose = () => { direct = false; updateLink(); setTimeout(startRtc, 4000); };
    dc.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onTv(m); };
    pc.onicecandidate = e => { if (e.candidate) sendRelay({ t: 'ice', c: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate }); };
    pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => sendRelay({ t: 'offer', sdp: pc.localDescription.sdp }));
    setTimeout(() => { if (!direct) updateLink(); }, 6000);
  }

  function onTv(m) {
    if (m.t === 'welcome') {
      if (!tvSeen) { tvSeen = true; if (m.rtc) startRtc(); }
      if (m.mode) setMode(m.mode, m);
    }
    else if (m.t === 'answer' && pc) pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }).catch(() => {});
    else if (m.t === 'ice' && pc) pc.addIceCandidate(m.c).catch(() => {});
    else if (m.t === 'pong') { rtt = Date.now() - m.ts; updateLink(); }
    else if (m.t === 'joined') { setMe(m.color, m.name); vibrate(60); }
    else if (m.t === 'left') setMe(null);
    else if (m.t === 'mode') setMode(m.mode, m);
    else if (m.t === 'stream') streamUntil = m.on ? performance.now() + 10000 : 0;
    else if (m.t === 'quiz') quizUpdate(m);
    else if (m.t === 'padinfo') { padInfo = m; if (mode === 'pad') drawPad(); }
    else if (m.t === 'buzz') vibrate(m.ms || 30);
    handlers.forEach(h => h(m));
    if (!tvSeen) { tvSeen = true; updateLink(); }
  }

  function updateLink() {
    const on = mq && mq.connected;
    const cls = 'dot linkDot' + (direct ? ' on' : on && tvSeen ? ' mid' : '');
    const txt = !on && !direct ? 'Connecting…' : !tvSeen ? 'Waiting for TV ' + room + '…' :
      (direct ? 'Direct' : 'Relay') + (rtt !== null ? ' · ' + rtt + ' ms' : '');
    document.querySelectorAll('.linkDot').forEach(e => e.className = cls);
    document.querySelectorAll('.linkTxt').forEach(e => e.textContent = txt);
  }
  function setMe(color, name) {
    document.querySelectorAll('.youTag').forEach(e => {
      e.style.display = color ? '' : 'none'; e.style.background = color || ''; e.textContent = name || '';
    });
    if (color) document.documentElement.style.setProperty('--me', color);
  }

  // =====================================================================
  // Screens / modes requested by the TV
  // =====================================================================
  let mode = 'join';
  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
  function setMode(mo) {
    if (mo === mode) return;
    mode = mo;
    if (mo === 'camera') { show('s-cam'); ensureCamera(); }
    else if (mo === 'pad') { show('s-pad'); sizePad(); }
    else if (mo === 'quiz') show('s-quiz');
    else show('s-lobby');
    if (mo !== 'camera') pauseCamera();
  }

  const params = new URLSearchParams(location.search);
  $('code').value = (params.get('room') || store.get('room', '')).toUpperCase();
  $('name').value = store.get('name', '');
  $('code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); });
  $('go').onclick = () => {
    const code = $('code').value.trim().toUpperCase();
    if (!/^[A-Z]{5}$/.test(code)) { msg('Room codes are 5 letters.', 'err'); return; }
    store.set('room', code); store.set('name', $('name').value.trim().slice(0, 12));
    connect(code);
    mode = 'lobby'; show('s-lobby');
    keepAwake();
  };
  function msg(t, kind) { const m = $('joinMsg'); m.textContent = t; m.className = 'msg ' + (kind || ''); }
  async function keepAwake() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); }, { once: true });
  }
  $('b-bigjoin').onclick = () => { send({ t: 'btn', b: 'a' }); vibrate(30); };

  // =====================================================================
  // Camera + body tracking
  // =====================================================================
  const video = $('video');
  let stream = null, camStarting = false;
  async function ensureCamera() {
    if (stream || camStarting) { if (stream) resumeCamera(); return; }
    camStarting = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }, audio: false });
      video.srcObject = stream;
      await video.play();
      schedule();
      if (!base) big('<b>Lean your phone 2–3 m away, facing you.</b><p>Your whole body should fit in the picture.<br>Then tap <b>Calibrate</b>.</p>');
    } catch (e) {
      big('<b>Camera blocked</b><p>Allow camera access for this page in your browser settings, then reload.</p>');
    }
    camStarting = false;
  }

    const x = padPos.x * pcv.width, y = padPos.y * pcv.height, r = Math.min(pcv.width, pcv.height) * 0.12;
    const col = my;
    pctx.fillStyle = col; pctx.globalAlpha = 0.25; pctx.beginPath(); pctx.arc(x, y, r * 1.8, 0, 6.283); pctx.fill();
    pctx.globalAlpha = 1; pctx.beginPath(); pctx.arc(x, y, r, 0, 6.283); pctx.fill();
    pctx.fillStyle = '#fff'; pctx.beginPath(); pctx.arc(x, y, r * 0.35, 0, 6.283); pctx.fill();
  }
  function padSend() {
    padTimer = null;
    if (!padPos) return;
    padSent = performance.now();
    send({ t: 'pad', x: +padPos.x.toFixed(3), y: +padPos.y.toFixed(3) });
  }
  function padMove(e) {
    e.preventDefault();
    const r = pad.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
    if (!t) return;
    padPos = { x: Math.max(0, Math.min(1, (t.clientX - r.left) / r.width)), y: Math.max(0, Math.min(1, (t.clientY - r.top) / r.height)) };
    $('padHint').style.display = 'none';
    drawPad();
    const wait = 22 - (performance.now() - padSent);
    if (wait <= 0) padSend(); else if (!padTimer) padTimer = setTimeout(padSend, wait);
  }
  ['touchstart', 'touchmove', 'mousedown', 'mousemove'].forEach(ev => pad.addEventListener(ev, e => { if (ev.startsWith('mouse') && !(e.buttons & 1)) return; padMove(e); }, { passive: false }));

  // =====================================================================
  // Quiz buttons
  // =====================================================================
  let quizLocked = false;
  document.querySelectorAll('.ans').forEach(el => el.addEventListener('click', () => {
    if (quizLocked) return;
    quizLocked = true;
    const i = +el.dataset.i;
    document.querySelectorAll('.ans').forEach(a => { a.classList.toggle('pick', a === el); a.classList.toggle('dim', a !== el); });
    send({ t: 'ans', i }); vibrate(30);
  }));
  function quizUpdate(m) {
    if (m.q !== undefined) $('q-text').textContent = m.q;
    if (m.opts) {
      quizLocked = !!m.locked;
      document.querySelectorAll('.ans').forEach((a, i) => {
        a.className = 'ans a' + i; a.style.display = m.opts[i] === undefined ? 'none' : '';
        a.querySelector('span').textContent = m.opts[i] || '';
      });
      $('q-res').textContent = '';
    }
    if (m.reveal !== undefined) {
      document.querySelectorAll('.ans').forEach((a, i) => { a.classList.remove('dim'); a.classList.toggle('right', i === m.reveal); a.classList.toggle('wrong', i !== m.reveal); });
      $('q-res').textContent = m.result || '';
      quizLocked = true;
    }
  }

  window.GNPhone = { state: st, base: () => base, cal: () => cal, mode: () => mode, calibrate, link: () => ({ direct, rtt }), m: () => lastM, gain: () => gain, thresh: () => thresh };
})();
</script>
</body>
</html>
